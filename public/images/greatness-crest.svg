<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">شعار العظمة</title>
  <desc id="desc">شعار نجمي فاخر باللون الأحمر الداكن والفضي مع كلمة العظمة في المنتصف</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3b070b"/>
      <stop offset="45%" stop-color="#220305"/>
      <stop offset="100%" stop-color="#070203"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="18%" stop-color="#e4e4e4"/>
      <stop offset="34%" stop-color="#8f8f8f"/>
      <stop offset="50%" stop-color="#fafafa"/>
      <stop offset="68%" stop-color="#969696"/>
      <stop offset="84%" stop-color="#efefef"/>
      <stop offset="100%" stop-color="#6f6f6f"/>
    </linearGradient>
    <radialGradient id="core" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#8d1119"/>
      <stop offset="45%" stop-color="#4d070c"/>
      <stop offset="100%" stop-color="#220305"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.52  0 1 0 0 0.06  0 0 1 0 0.10  0 0 0 1 0"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <pattern id="noise" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="12" r="1.1" fill="#ffffff" fill-opacity="0.04"/>
      <circle cx="42" cy="29" r="1.2" fill="#ffffff" fill-opacity="0.03"/>
      <circle cx="71" cy="60" r="1" fill="#ffffff" fill-opacity="0.025"/>
      <circle cx="27" cy="67" r="1.1" fill="#ffffff" fill-opacity="0.025"/>
      <circle cx="55" cy="9" r="1.3" fill="#ffffff" fill-opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#noise)" opacity="0.5"/>
  <circle cx="600" cy="600" r="300" fill="#7d0f17" opacity="0.18" filter="url(#softGlow)"/>

  <g transform="translate(600 600)" filter="url(#shadow)">
    <g fill="url(#metal)">
      <polygon points="0,-480 34,-120 0,-30 -34,-120"/>
      <polygon points="0,480 34,120 0,30 -34,120"/>
      <polygon points="-480,0 -120,34 -30,0 -120,-34"/>
      <polygon points="480,0 120,34 30,0 120,-34"/>

      <polygon points="340,-340 104,-52 52,-104"/>
      <polygon points="-340,-340 -104,-52 -52,-104"/>
      <polygon points="340,340 104,52 52,104"/>
      <polygon points="-340,340 -104,52 -52,104"/>
    </g>

    <circle r="170" fill="url(#core)" stroke="#5a0c11" stroke-width="20"/>
    <circle r="190" fill="none" stroke="#8e1720" stroke-opacity="0.3" stroke-width="12"/>

    <text x="0" y="20" text-anchor="middle" font-family="Cairo, Tajawal, Arial, sans-serif" font-size="116" font-weight="900" fill="#ffffff">العظمة</text>
    <text x="0" y="84" text-anchor="middle" font-family="Cairo, Tajawal, Arial, sans-serif" font-size="24" font-weight="700" fill="#f1d9db" opacity="0.85">The Greatness</text>
  </g>
</svg>
